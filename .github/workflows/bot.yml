name: Run Market Voice Bot

on:
  schedule:
    # Каждые 15 минут. Уменьшая интервал, помните о лимитах Groq API
    # и о том, что GitHub Actions cron не гарантирует точность до минуты.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-voice-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python -m market_voice_bot.main

      - name: Commit updated state
        run: |
          git config user.name "market-voice-bot"
          git config user.email "actions@github.com"
          git add data/state.db
          git diff --staged --quiet || git commit -m "chore: update bot state [skip ci]"
          git push
